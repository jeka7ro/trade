[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/proxy"
  to = "/.netlify/functions/proxy"
  status = 200

[[redirects]]
  from = "/logo"
  to = "/.netlify/functions/proxy"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/proxy"
  status = 200

# ─── SCHEDULED FUNCTIONS ───────────────────────────────────────
[functions."scanner"]
  schedule = "*/10 * * * *"
